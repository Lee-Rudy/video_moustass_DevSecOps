# ==============================================================================
# Configuration Spring Boot pour environnement Docker
# ==============================================================================
# Ce profil est activé automatiquement quand SPRING_PROFILES_ACTIVE=docker
# Les variables d'environnement sont injectées par docker-compose.yml

spring.application.name=auth
server.port=8082

# =============================================================================
# Configuration Base de données MySQL (via variables d'environnement Docker)
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:moustass_video}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true&maxReconnects=5
spring.datasource.username=${DB_USER:moustass_user}
spring.datasource.password=${DB_PASSWORD:moustass_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration du pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =============================================================================
# Configuration Vault (via variables d'environnement Docker)
# =============================================================================
spring.cloud.vault.uri=${SPRING_CLOUD_VAULT_URI:http://vault:8200}
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN}
spring.cloud.vault.connection-timeout=5000
spring.cloud.vault.read-timeout=15000

# Configuration Transit pour le chiffrement des vidéos
app.vault.video-dek-key=video-dek

# =============================================================================
# Configuration JWT
# =============================================================================
auth.jwt.secret=${JWT_SECRET:PleaseChangeMeInProdUseAtLeast32CharactersForSecurity2026!}

# =============================================================================
# Configuration CORS (Frontend)
# =============================================================================
app.frontend.origin=${REACT_HOST:http://localhost}:${REACT_PORT:3000}

# =============================================================================
# Configuration Stockage des vidéos
# =============================================================================
app.video.storage-path=${VIDEO_STORAGE_PATH:/app/data/videos}

# Configuration des uploads (multipart)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
spring.servlet.multipart.enabled=true

# =============================================================================
# Configuration Email SMTP pour MFA
# =============================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =============================================================================
# Configuration OAuth2 Google
# =============================================================================
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI:http://localhost:8082/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.authorization-params.prompt=select_account

# Configuration du provider Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# =============================================================================
# Configuration MFA
# =============================================================================
mfa.code.expiration.minutes=${MFA_CODE_EXPIRATION:10}
mfa.code.length=${MFA_CODE_LENGTH:6}

# =============================================================================
# Configuration Demo Login (désactivé par défaut)
# =============================================================================
demo.login.enabled=${DEMO_LOGIN_ENABLED:false}
demo.login.mail=${DEMO_LOGIN_MAIL:}
demo.login.password=${DEMO_LOGIN_PASSWORD:}

# =============================================================================
# Configuration Actuator (pour les health checks)
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# =============================================================================
# Configuration Logging (Docker)
# =============================================================================
logging.level.root=INFO
logging.level.com.example.auth=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.charset.console=UTF-8

# =============================================================================
# Configuration de la Timezone
# =============================================================================
spring.jackson.time-zone=Europe/Paris
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Paris
